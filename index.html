<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Lube City | Customer Feedback</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="card">

    <div class="logo">
      LUBE <span>CITY</span>
    </div>

    <section>

      <div class="icon">★</div>

      <h1>How did we do?</h1>

      <p>
        Your feedback helps us keep delivering great service.
      </p>

      <!-- GOOGLE REVIEW -->
      <a
        id="reviewButton"
        class="button primary"
        href="#"
        target="_blank"
        rel="noopener"
      >
        Leave a Google Review
      </a>

      <!-- SURVEY / $50 DRAW -->
      <a
        id="surveyButton"
        class="survey-button"
        href="#"
        target="_blank"
        rel="noopener"
      >
        ENTER TO WIN $50
      </a>

      <p class="survey-note">
        Write a short survey for your chance to win.
      </p>

    </section>

  </main>

  <footer>
    Lube City • Customer Feedback
  </footer>

  <script src="script.js"></script>

</body>
</html>
